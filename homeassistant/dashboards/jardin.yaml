
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Ajout le 29/07/26 pour ajouter appareils et services au menu colonne gauche
panel_custom:
  - name: appareils_services
    sidebar_title: "Appareils & Services"
    sidebar_icon: mdi:cpu-64-bit
    url_path: config/integrations
    module_url: /static/custom-panel.js
    
# Ajout le 24/08/2026 pour le pilotage dynamique des sorties audio du Mac de Claude
shell_command:
  mac_set_audio_output: "ssh -i /config/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null AHR@192.168.1.1 '/usr/local/bin/SwitchAudioSource -t output -s \"{{ device }}\"'"
  lire_sortie_mac: "ssh -i /config/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null AHR@192.168.1.1 '/usr/local/bin/SwitchAudioSource -t output -c'"

# Ajout le 13/09/26 sur les conseils de Claude en relation avec GitHub  
homeassistant:
  packages: !include_dir_named packages

# Ajout le 13/09/26 sur les conseils de Claude - Tableau de bord Jardin  
lovelace:
  mode: storage
  dashboards:
    jardin-dashboard:
      mode: yaml
      title: "Jardin"
      icon: mdi:flower
      filename: dashboards/jardin.yaml