# ============================================================================
# Package Home Assistant - Gestion de l'éclairage du jardin par badges BLE
# ============================================================================
# Contient : helpers (input_*), capteurs (trigger-based), automatisations, rest_command
#
# NOTE DE VERSION : Cette version corrige un bug de l'architecture initiale.
# input_text.set_value n'accepte pas de paramètre "attributes" (non documenté,
# non supporté) - les capteurs RSSI/batterie utilisaient ce mécanisme et ne
# fonctionnaient jamais. Remplacé par des "trigger-based template sensors",
# le mécanisme natif HA pour ce cas d'usage (cf. doc officielle Template).
#
# Cette version corrige aussi un bug fonctionnel : le script précédent
# appelait shelly_toggle_with_delay (avec on:true) dès qu'un badge était
# détecté, ce qui ALLUMAIT la lumière automatiquement - contraire à la
# demande explicite ("Non : Allumage automatique"). Désormais, la détection
# d'un badge "arme" seulement une fenêtre de temps (X secondes réglable) ;
# c'est le clic manuel sur l'interrupteur qui déclenche l'application de la
# durée du badge, si celui-ci a été vu récemment.

# ============================================================================
# REST COMMANDS - Communication avec le Shelly 1 Gen4
# ============================================================================
rest_command:
  # Synchro de la durée de base vers le Shelly auto_off_delay
  shelly_set_duration:
    url: "http://192.168.1.36/rpc/Switch.SetConfig"
    method: POST
    payload: '{"id":0,"auto_off":true,"auto_off_delay":{{ duration }}}'
    content_type: "application/json"

  # Toggle avec prolongation (option C) - appelé uniquement quand le relais
  # est déjà "on" (voir automation "Jardin - Allumage avec badge récent")
  shelly_toggle_with_delay:
    url: "http://192.168.1.36/rpc/Switch.Set"
    method: POST
    payload: '{"id":0,"on":true,"toggle_after":{{ duration }}}'
    content_type: "application/json"

  # Extinction immédiate (non utilisé actuellement, gardé pour usage futur)
  shelly_turn_off:
    url: "http://192.168.1.36/rpc/Switch.Set"
    method: POST
    payload: '{"id":0,"on":false}'
    content_type: "application/json"

# ============================================================================
# HELPERS - Entrées utilisateur
# ============================================================================
input_text:
  # Noms des badges
  badge_1_nom:
    name: "Badge 1 - Nom"
    min: 1
    max: 20

  badge_2_nom:
    name: "Badge 2 - Nom"
    min: 1
    max: 20

  badge_3_nom:
    name: "Badge 3 - Nom"
    min: 1
    max: 20

  # Adresses MAC des badges (format : AA:BB:CC:DD:EE:FF)
  badge_1_mac:
    name: "Badge 1 - Adresse MAC"
    min: 17
    max: 17
    pattern: '[A-Fa-f0-9]{2}(:[A-Fa-f0-9]{2}){5}'

  badge_2_mac:
    name: "Badge 2 - Adresse MAC"
    min: 17
    max: 17
    pattern: '[A-Fa-f0-9]{2}(:[A-Fa-f0-9]{2}){5}'

  badge_3_mac:
    name: "Badge 3 - Adresse MAC"
    min: 17
    max: 17
    pattern: '[A-Fa-f0-9]{2}(:[A-Fa-f0-9]{2}){5}'

  # Journal des passages (JSON) - 255 caractères = limite HA pour input_text
  jardin_journal_passages:
    name: "Journal des passages"
    max: 255

input_number:
  # Durée d'éclairage de base (secondes) - utilisée si aucun badge éligible
  duree_active_d_eclairage:
    name: "Durée d'éclairage de base"
    unit_of_measurement: "s"
    min: 15
    max: 300
    step: 5
    initial: 60
    icon: mdi:timer

  # Seuils RSSI de détection (négatif, plus proche = moins négatif)
  badge_rssi_filtrage_porte:
    name: "Seuil RSSI Porte"
    unit_of_measurement: "dBm"
    min: -105
    max: -105
    step: 1
    initial: -80
    icon: mdi:signal

  badge_rssi_filtrage_maison:
    name: "Seuil RSSI Maison"
    unit_of_measurement: "dBm"
    min: -95
    max: -40
    step: 1
    initial: -80
    icon: mdi:signal

  # Délai (X) : durée pendant laquelle un badge détecté reste "éligible"
  # pour un allumage manuel. Si aucun badge n'a été vu depuis plus de X
  # secondes au moment du clic, la durée de base s'applique (comportement
  # natif du Shelly, aucune action supplémentaire requise).
  badge_timeout_detection:
    name: "Délai de prise en compte badge avant clic"
    unit_of_measurement: "s"
    min: 5
    max: 180
    step: 5
    initial: 15
    icon: mdi:timer-sand

input_datetime:
  # Durées d'éclairage par badge (stockées comme time HH:MM:SS)
  badge_1_duree:
    name: "Badge 1 - Durée éclairage"
    has_time: true
    has_date: false

  badge_2_duree:
    name: "Badge 2 - Durée éclairage"
    has_time: true
    has_date: false

  badge_3_duree:
    name: "Badge 3 - Durée éclairage"
    has_time: true
    has_date: false

  jardin_dernier_badge_vu:
    name: "Dernier badge détecté"
    has_time: true
    has_date: true

# ============================================================================
# TEMPLATE SENSORS - Trigger-based, mis à jour depuis l'événement BLE
# ============================================================================
# Toutes les entités ci-dessous partagent le même déclencheur (l'événement
# esphome.presence_ble) mais chacune a sa propre "conditions:" qui détermine
# si CETTE entité doit se mettre à jour pour cet événement précis. Si la
# condition est fausse, l'entité conserve sa valeur précédente (cf. doc
# officielle HA : "Trigger based sensor - Using conditions to control updates").
template:
  - triggers:
      - trigger: event
        event_type: esphome.presence_ble
    sensor:
      # ------------------------------------------------------------------
      # RSSI par badge et par source (Porte / Maison)
      # ------------------------------------------------------------------
      - name: "Badge 1 RSSI Porte"
        unique_id: badge_1_rssi_porte
        unit_of_measurement: "dBm"
        icon: mdi:signal
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.source == 'PORTE' and
                 trigger.event.data.mac | upper == states('input_text.badge_1_mac') | upper }}
        state: "{{ trigger.event.data.rssi }}"

      - name: "Badge 1 RSSI Maison"
        unique_id: badge_1_rssi_maison
        unit_of_measurement: "dBm"
        icon: mdi:signal
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.source == 'MAISON' and
                 trigger.event.data.mac | upper == states('input_text.badge_1_mac') | upper }}
        state: "{{ trigger.event.data.rssi }}"

      - name: "Badge 2 RSSI Porte"
        unique_id: badge_2_rssi_porte
        unit_of_measurement: "dBm"
        icon: mdi:signal
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.source == 'PORTE' and
                 trigger.event.data.mac | upper == states('input_text.badge_2_mac') | upper }}
        state: "{{ trigger.event.data.rssi }}"

      - name: "Badge 2 RSSI Maison"
        unique_id: badge_2_rssi_maison
        unit_of_measurement: "dBm"
        icon: mdi:signal
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.source == 'MAISON' and
                 trigger.event.data.mac | upper == states('input_text.badge_2_mac') | upper }}
        state: "{{ trigger.event.data.rssi }}"

      - name: "Badge 3 RSSI Porte"
        unique_id: badge_3_rssi_porte
        unit_of_measurement: "dBm"
        icon: mdi:signal
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.source == 'PORTE' and
                 trigger.event.data.mac | upper == states('input_text.badge_3_mac') | upper }}
        state: "{{ trigger.event.data.rssi }}"

      - name: "Badge 3 RSSI Maison"
        unique_id: badge_3_rssi_maison
        unit_of_measurement: "dBm"
        icon: mdi:signal
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.source == 'MAISON' and
                 trigger.event.data.mac | upper == states('input_text.badge_3_mac') | upper }}
        state: "{{ trigger.event.data.rssi }}"

      # ------------------------------------------------------------------
      # Batterie par badge (mV, envoyée uniquement par l'ESP Maison)
      # Condition battery_mv > 0 : évite d'écraser une vraie valeur par 0
      # quand un événement arrive sans trame Eddystone-TLM ce coup-ci.
      # ------------------------------------------------------------------
      - name: "Badge 1 Batterie"
        unique_id: badge_1_batterie
        unit_of_measurement: "mV"
        icon: mdi:battery
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.mac | upper == states('input_text.badge_1_mac') | upper and
                 trigger.event.data.battery_mv | int(0) > 0 }}
        state: "{{ trigger.event.data.battery_mv }}"

      - name: "Badge 2 Batterie"
        unique_id: badge_2_batterie
        unit_of_measurement: "mV"
        icon: mdi:battery
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.mac | upper == states('input_text.badge_2_mac') | upper and
                 trigger.event.data.battery_mv | int(0) > 0 }}
        state: "{{ trigger.event.data.battery_mv }}"

      - name: "Badge 3 Batterie"
        unique_id: badge_3_batterie
        unit_of_measurement: "mV"
        icon: mdi:battery
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.mac | upper == states('input_text.badge_3_mac') | upper and
                 trigger.event.data.battery_mv | int(0) > 0 }}
        state: "{{ trigger.event.data.battery_mv }}"

      # ------------------------------------------------------------------
      # Horodatage de la dernière détection VALIDE (RSSI ≥ seuil) par badge
      # Sert à "armer" la durée du badge pour le prochain clic manuel.
      # ------------------------------------------------------------------
      - name: "Badge 1 Dernière Détection Valide"
        unique_id: badge_1_derniere_detection_valide
        device_class: timestamp
        conditions:
          - condition: template
            value_template: >-
              {%- set seuil_porte = states('input_number.badge_rssi_filtrage_porte') | int(-80) -%}
              {%- set seuil_maison = states('input_number.badge_rssi_filtrage_maison') | int(-80) -%}
              {%- set rssi = trigger.event.data.rssi | int(-999) -%}
              {{ trigger.event.data.mac | upper == states('input_text.badge_1_mac') | upper and
                 ((trigger.event.data.source == 'PORTE' and rssi >= seuil_porte) or
                  (trigger.event.data.source == 'MAISON' and rssi >= seuil_maison)) }}
        state: "{{ now().isoformat() }}"

      - name: "Badge 2 Dernière Détection Valide"
        unique_id: badge_2_derniere_detection_valide
        device_class: timestamp
        conditions:
          - condition: template
            value_template: >-
              {%- set seuil_porte = states('input_number.badge_rssi_filtrage_porte') | int(-80) -%}
              {%- set seuil_maison = states('input_number.badge_rssi_filtrage_maison') | int(-80) -%}
              {%- set rssi = trigger.event.data.rssi | int(-999) -%}
              {{ trigger.event.data.mac | upper == states('input_text.badge_2_mac') | upper and
                 ((trigger.event.data.source == 'PORTE' and rssi >= seuil_porte) or
                  (trigger.event.data.source == 'MAISON' and rssi >= seuil_maison)) }}
        state: "{{ now().isoformat() }}"

      - name: "Badge 3 Dernière Détection Valide"
        unique_id: badge_3_derniere_detection_valide
        device_class: timestamp
        conditions:
          - condition: template
            value_template: >-
              {%- set seuil_porte = states('input_number.badge_rssi_filtrage_porte') | int(-80) -%}
              {%- set seuil_maison = states('input_number.badge_rssi_filtrage_maison') | int(-80) -%}
              {%- set rssi = trigger.event.data.rssi | int(-999) -%}
              {{ trigger.event.data.mac | upper == states('input_text.badge_3_mac') | upper and
                 ((trigger.event.data.source == 'PORTE' and rssi >= seuil_porte) or
                  (trigger.event.data.source == 'MAISON' and rssi >= seuil_maison)) }}
        state: "{{ now().isoformat() }}"

  # ==========================================================================
  # BINARY SENSORS - "À portée" par badge/source
  # Trigger-based (réévalué toutes les 5s) pour détecter aussi l'ABSENCE de
  # nouvelle trame : si le capteur RSSI correspondant n'a pas été mis à jour
  # depuis plus de 21 secondes (2x le rythme d'émission normal ~10s + marge),
  # "à portée" repasse automatiquement à "off", même si le RSSI affiché reste
  # figé sur sa dernière valeur connue (historique, volontairement conservé).
  # ==========================================================================
  - triggers:
      - trigger: time_pattern
        seconds: "/5"
    sensor:
      - name: "Badge 1 Temps Écoulé"
        unique_id: badge_1_temps_ecoule
        icon: mdi:timer-outline
        state: >-
          {%- set _ent = states.sensor.badge_1_derniere_detection_valide -%}
          {%- if _ent is none or _ent.state in ['unknown', 'unavailable'] -%}
            --:--
          {%- else -%}
            {%- set ecoule = (now() - _ent.last_updated).total_seconds() | int -%}
            {%- set m, s = ecoule // 60, ecoule % 60 -%}
            {{ '%02d:%02d' | format(m, s) }}
          {%- endif -%}

      - name: "Badge 2 Temps Écoulé"
        unique_id: badge_2_temps_ecoule
        icon: mdi:timer-outline
        state: >-
          {%- set _ent = states.sensor.badge_2_derniere_detection_valide -%}
          {%- if _ent is none or _ent.state in ['unknown', 'unavailable'] -%}
            --:--
          {%- else -%}
            {%- set ecoule = (now() - _ent.last_updated).total_seconds() | int -%}
            {%- set m, s = ecoule // 60, ecoule % 60 -%}
            {{ '%02d:%02d' | format(m, s) }}
          {%- endif -%}

      - name: "Badge 3 Temps Écoulé"
        unique_id: badge_3_temps_ecoule
        icon: mdi:timer-outline
        state: >-
          {%- set _ent = states.sensor.badge_3_derniere_detection_valide -%}
          {%- if _ent is none or _ent.state in ['unknown', 'unavailable'] -%}
            --:--
          {%- else -%}
            {%- set ecoule = (now() - _ent.last_updated).total_seconds() | int -%}
            {%- set m, s = ecoule // 60, ecoule % 60 -%}
            {{ '%02d:%02d' | format(m, s) }}
          {%- endif -%}

    binary_sensor:
      - name: "Badge 1 à portée Porte"
        unique_id: badge_1_a_portee_porte
        icon: mdi:motion-sensor
        state: >-
          {%- set rssi_ok = states('sensor.badge_1_rssi_porte') | int(-999) >=
                             states('input_number.badge_rssi_filtrage_porte') | int(-80) -%}
          {%- set _ent = states.sensor.badge_1_rssi_porte -%}
          {%- set recent = ((now() - _ent.last_updated).total_seconds() <= 21) if _ent is not none else false -%}
          {{ rssi_ok and recent }}

      - name: "Badge 2 à portée Porte"
        unique_id: badge_2_a_portee_porte
        icon: mdi:motion-sensor
        state: >-
          {%- set rssi_ok = states('sensor.badge_2_rssi_porte') | int(-999) >=
                             states('input_number.badge_rssi_filtrage_porte') | int(-80) -%}
          {%- set _ent = states.sensor.badge_2_rssi_porte -%}
          {%- set recent = ((now() - _ent.last_updated).total_seconds() <= 21) if _ent is not none else false -%}
          {{ rssi_ok and recent }}

      - name: "Badge 3 à portée Porte"
        unique_id: badge_3_a_portee_porte
        icon: mdi:motion-sensor
        state: >-
          {%- set rssi_ok = states('sensor.badge_3_rssi_porte') | int(-999) >=
                             states('input_number.badge_rssi_filtrage_porte') | int(-80) -%}
          {%- set _ent = states.sensor.badge_3_rssi_porte -%}
          {%- set recent = ((now() - _ent.last_updated).total_seconds() <= 21) if _ent is not none else false -%}
          {{ rssi_ok and recent }}

      - name: "Badge 1 à portée Maison"
        unique_id: badge_1_a_portee_maison
        icon: mdi:motion-sensor
        state: >-
          {%- set rssi_ok = states('sensor.badge_1_rssi_maison') | int(-999) >=
                             states('input_number.badge_rssi_filtrage_maison') | int(-80) -%}
          {%- set _ent = states.sensor.badge_1_rssi_maison -%}
          {%- set recent = ((now() - _ent.last_updated).total_seconds() <= 21) if _ent is not none else false -%}
          {{ rssi_ok and recent }}

      - name: "Badge 2 à portée Maison"
        unique_id: badge_2_a_portee_maison
        icon: mdi:motion-sensor
        state: >-
          {%- set rssi_ok = states('sensor.badge_2_rssi_maison') | int(-999) >=
                             states('input_number.badge_rssi_filtrage_maison') | int(-80) -%}
          {%- set _ent = states.sensor.badge_2_rssi_maison -%}
          {%- set recent = ((now() - _ent.last_updated).total_seconds() <= 21) if _ent is not none else false -%}
          {{ rssi_ok and recent }}

      - name: "Badge 3 à portée Maison"
        unique_id: badge_3_a_portee_maison
        icon: mdi:motion-sensor
        state: >-
          {%- set rssi_ok = states('sensor.badge_3_rssi_maison') | int(-999) >=
                             states('input_number.badge_rssi_filtrage_maison') | int(-80) -%}
          {%- set _ent = states.sensor.badge_3_rssi_maison -%}
          {%- set recent = ((now() - _ent.last_updated).total_seconds() <= 21) if _ent is not none else false -%}
          {{ rssi_ok and recent }}

# ============================================================================
# SCRIPT - Journal, horodatage, et déclenchement de la durée badge au clic
# ============================================================================
script:
  # Traite chaque détection BLE : horodatage global + journal si dans le seuil
  # (n'allume JAMAIS la lumière - voir note de version en tête de fichier)
  jardin_traiter_detection_badge:
    description: "Horodatage + journal sur détection badge (n'allume pas la lumière)"
    mode: queued
    max_runs: 10
    variables:
      mac_normalise: "{{ (mac | default('') | upper | replace(' ', '')) }}"
      badge_index: |
        {%- set b1 = (states('input_text.badge_1_mac') | default('') | upper | replace(' ', '')) -%}
        {%- set b2 = (states('input_text.badge_2_mac') | default('') | upper | replace(' ', '')) -%}
        {%- set b3 = (states('input_text.badge_3_mac') | default('') | upper | replace(' ', '')) -%}
        {%- if mac_normalise == b1 -%}1
        {%- elif mac_normalise == b2 -%}2
        {%- elif mac_normalise == b3 -%}3
        {%- else -%}0{%- endif -%}
      rssi_int: "{{ rssi | int(default=-999) }}"
      seuil_porte: "{{ states('input_number.badge_rssi_filtrage_porte') | int(default=-80) }}"
      seuil_maison: "{{ states('input_number.badge_rssi_filtrage_maison') | int(default=-80) }}"
    sequence:
      - if: "{{ badge_index | int > 0 }}"
        then:
          # Horodatage global (informatif, tous badges connus confondus)
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.jardin_dernier_badge_vu
            data:
              datetime: "{{ now().isoformat() }}"

          # Journal uniquement si détection dans le seuil (= vrai passage)
          - if: "{{ (source == 'PORTE' and rssi_int >= seuil_porte) or (source == 'MAISON' and rssi_int >= seuil_maison) }}"
            then:
              - service: script.jardin_ajouter_journal
                data:
                  nom: "{{ states('input_text.badge_' + badge_index + '_nom') }}"
                  rssi: "{{ rssi_int }}"
                  source: "{{ source }}"

  # Ajouter une entrée au journal JSON (5 dernières entrées, limite 255 car.)
  jardin_ajouter_journal:
    description: "Ajoute un passage au journal JSON"
    mode: queued
    variables:
      journal_actuel: "{{ (states('input_text.jardin_journal_passages') | default('[]') | from_json) }}"
    sequence:
      - variables:
          nouvelle_entree:
            timestamp: "{{ now().isoformat() }}"
            nom: "{{ nom | default('Inconnu') }}"
            rssi: "{{ rssi | default(0) }}"
            source: "{{ source | default('?') }}"
          journal_mis_a_jour: |
            {%- set journal = journal_actuel -%}
            {%- set _ = journal.insert(0, nouvelle_entree) -%}
            {%- if journal | length > 5 -%}
              {{ journal[:5] | tojson }}
            {%- else -%}
              {{ journal | tojson }}
            {%- endif -%}
      - service: input_text.set_value
        target:
          entity_id: input_text.jardin_journal_passages
        data:
          value: "{{ journal_mis_a_jour[:255] }}"

  # Appelé quand le relais Shelly passe à "on" : si un badge a été vu dans
  # les X dernières secondes (badge_timeout_detection), applique sa durée.
  # Sinon, ne fait rien : la durée de base (gravée dans le Shelly) s'applique.
  jardin_declencher_duree_badge:
    description: "Applique la durée du badge le plus récent si détecté dans les X dernières secondes"
    mode: single
    variables:
      timeout_x: "{{ states('input_number.badge_timeout_detection') | int(15) }}"
      now_ts: "{{ now().timestamp() }}"
      durees_eligibles: >-
        {%- set ns = namespace(liste=[]) -%}
        {%- for i in [1, 2, 3] -%}
          {%- set dernier_vu = states('sensor.badge_' ~ i ~ '_derniere_detection_valide') -%}
          {%- if dernier_vu not in ['unknown', 'unavailable', 'none', None] -%}
            {%- set ecoule = now_ts - as_timestamp(dernier_vu) -%}
            {%- if ecoule <= timeout_x -%}
              {%- set duree_dt = states('input_datetime.badge_' ~ i ~ '_duree') -%}
              {%- if duree_dt not in ['unknown', 'unavailable'] -%}
                {%- set duree_sec = (as_timestamp(duree_dt) - as_timestamp('1970-01-01')) | int -%}
                {%- set ns.liste = ns.liste + [duree_sec] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.liste }}
    sequence:
      - if: "{{ durees_eligibles | length > 0 }}"
        then:
          - service: rest_command.shelly_toggle_with_delay
            data:
              duration: "{{ durees_eligibles | max }}"

  # Extinction manuelle : restaurer durée de base
  jardin_extinction_manuelle:
    description: "Extinction - restaure durée de base pour le prochain allumage sans badge"
    sequence:
      - service: rest_command.shelly_set_duration
        data:
          duration: "{{ states('input_number.duree_active_d_eclairage') | int(default=60) }}"

# ============================================================================
# AUTOMATISATIONS - Logique de détection et pilotage
# ============================================================================
automation:
  # Détection d'un badge BLE via événement ESPHome (journal + horodatage)
  - alias: "Jardin - Détection badge BLE"
    description: "Traite les événements de détection badge (sans allumer la lumière)"
    trigger:
      platform: event
      event_type: esphome.presence_ble
    action:
      - service: script.jardin_traiter_detection_badge
        data:
          mac: "{{ trigger.event.data.mac }}"
          rssi: "{{ trigger.event.data.rssi }}"
          source: "{{ trigger.event.data.source }}"

  # Allumage manuel (clic) : applique la durée du badge si vu récemment
  - alias: "Jardin - Allumage avec badge récent"
    description: "Sur clic, utilise la durée du badge s'il a été détecté dans les X dernières secondes"
    trigger:
      platform: state
      entity_id: switch.shelly1g4_ccba97c455a0
      to: "on"
    action:
      - service: script.jardin_declencher_duree_badge

  # Extinction manuelle (via tableau de bord ou bouton physique)
  - alias: "Jardin - Extinction manuelle"
    description: "Restaure durée de base à l'extinction"
    trigger:
      platform: state
      entity_id: switch.shelly1g4_ccba97c455a0
      to: "off"
    action:
      - delay: 500ms  # Attendre réaction Shelly
      - service: script.jardin_extinction_manuelle

  # Synchro durée de base au démarrage de HA
  - alias: "Jardin - Synchro durée au démarrage"
    description: "Pousse la durée de base vers le Shelly au démarrage"
    trigger:
      platform: homeassistant
      event: start
    action:
      - delay: 10s  # Attendre HA prêt
      - service: rest_command.shelly_set_duration
        data:
          duration: "{{ states('input_number.duree_active_d_eclairage') | int(default=60) }}"

  # Synchro durée de base si changement dans le tableau de bord
  - alias: "Jardin - Synchro durée sur changement"
    description: "Pousse la durée de base vers le Shelly si modification"
    trigger:
      platform: state
      entity_id: input_number.duree_active_d_eclairage
    action:
      - service: rest_command.shelly_set_duration
        data:
          duration: "{{ states('input_number.duree_active_d_eclairage') | int(default=60) }}"
