# ============================================================================
# Package Home Assistant - Gestion de l'éclairage du jardin par badges BLE
# ============================================================================
# Contient : helpers (input_*), capteurs, automatisations, rest_command

# ============================================================================
# REST COMMANDS - Communication avec le Shelly 1 Gen4
# ============================================================================
rest_command:
  # Synchro de la durée de base vers le Shelly auto_off_delay
  shelly_set_duration:
    url: "http://192.168.1.36/rpc/Switch.SetConfig"
    method: POST
    payload: '{"id":0,"auto_off":true,"auto_off_delay":{{ duration }}}'
    content_type: "application/json"

  # Toggle avec prolongation (option C)
  shelly_toggle_with_delay:
    url: "http://192.168.1.36/rpc/Switch.Set"
    method: POST
    payload: '{"id":0,"on":true,"toggle_after":{{ duration }}}'
    content_type: "application/json"

  # Extinction immédiate (extinction manuelle)
  shelly_turn_off:
    url: "http://192.168.1.36/rpc/Switch.Set"
    method: POST
    payload: '{"id":0,"on":false}'
    content_type: "application/json"

# ============================================================================
# HELPERS - Entrées utilisateur
# ============================================================================
input_text:
  # Noms des badges
  badge_1_nom:
    name: "Badge 1 - Nom"
    min: 1
    max: 20

  badge_2_nom:
    name: "Badge 2 - Nom"
    min: 1
    max: 20

  badge_3_nom:
    name: "Badge 3 - Nom"
    min: 1
    max: 20

  # Adresses MAC des badges (format : AA:BB:CC:DD:EE:FF)
  badge_1_mac:
    name: "Badge 1 - Adresse MAC"
    min: 17
    max: 17
    pattern: '[A-Fa-f0-9]{2}(:[A-Fa-f0-9]{2}){5}'

  badge_2_mac:
    name: "Badge 2 - Adresse MAC"
    min: 17
    max: 17
    pattern: '[A-Fa-f0-9]{2}(:[A-Fa-f0-9]{2}){5}'

  badge_3_mac:
    name: "Badge 3 - Adresse MAC"
    min: 17
    max: 17
    pattern: '[A-Fa-f0-9]{2}(:[A-Fa-f0-9]{2}){5}'

  # Journal des passages (JSON)
  jardin_journal_passages:
    name: "Journal des passages"
    max: 5000

input_number:
  # Durée d'éclairage de base (secondes)
  duree_active_d_eclairage:
    name: "Durée d'éclairage de base"
    unit_of_measurement: "s"
    min: 15
    max: 300
    step: 5
    icon: mdi:timer

  # Seuils RSSI de détection (négatif, plus proche = moins négatif)
  badge_rssi_filtrage_porte:
    name: "Seuil RSSI Porte"
    unit_of_measurement: "dBm"
    min: -95
    max: -40
    step: 1
    icon: mdi:signal

  badge_rssi_filtrage_maison:
    name: "Seuil RSSI Maison"
    unit_of_measurement: "dBm"
    min: -95
    max: -40
    step: 1
    icon: mdi:signal

input_datetime:
  # Durées d'éclairage par badge (stockées comme time 00:MM:SS)
  badge_1_duree:
    name: "Badge 1 - Durée éclairage"
    has_time: true
    has_date: false

  badge_2_duree:
    name: "Badge 2 - Durée éclairage"
    has_time: true
    has_date: false

  badge_3_duree:
    name: "Badge 3 - Durée éclairage"
    has_time: true
    has_date: false

  jardin_dernier_badge_vu:
    name: "Dernier badge détecté"
    has_time: true
    has_date: true

# ============================================================================
# TEMPLATE SENSORS - Affichage du RSSI et état des badges
# ============================================================================
template:
  sensor:
    # RSSI par badge - Porte
    - name: "Badge 1 RSSI Porte"
      unique_id: badge_1_rssi_porte
      unit_of_measurement: "dBm"
      icon: mdi:signal
      state: "{{ state_attr('input_text.badge_1_mac', 'rssi_porte') | default('N/A') }}"

    - name: "Badge 2 RSSI Porte"
      unique_id: badge_2_rssi_porte
      unit_of_measurement: "dBm"
      icon: mdi:signal
      state: "{{ state_attr('input_text.badge_2_mac', 'rssi_porte') | default('N/A') }}"

    - name: "Badge 3 RSSI Porte"
      unique_id: badge_3_rssi_porte
      unit_of_measurement: "dBm"
      icon: mdi:signal
      state: "{{ state_attr('input_text.badge_3_mac', 'rssi_porte') | default('N/A') }}"

    # RSSI par badge - Maison
    - name: "Badge 1 RSSI Maison"
      unique_id: badge_1_rssi_maison
      unit_of_measurement: "dBm"
      icon: mdi:signal
      state: "{{ state_attr('input_text.badge_1_mac', 'rssi_maison') | default('N/A') }}"

    - name: "Badge 2 RSSI Maison"
      unique_id: badge_2_rssi_maison
      unit_of_measurement: "dBm"
      icon: mdi:signal
      state: "{{ state_attr('input_text.badge_2_mac', 'rssi_maison') | default('N/A') }}"

    - name: "Badge 3 RSSI Maison"
      unique_id: badge_3_rssi_maison
      unit_of_measurement: "dBm"
      icon: mdi:signal
      state: "{{ state_attr('input_text.badge_3_mac', 'rssi_maison') | default('N/A') }}"

  binary_sensor:
    # Badge à portée - Porte
    - name: "Badge 1 à portée Porte"
      unique_id: badge_1_a_portee_porte
      icon: mdi:motion-sensor
      state: >
        {% set rssi = state_attr('input_text.badge_1_mac', 'rssi_porte') | int(default=-999) %}
        {% set seuil = states('input_number.badge_rssi_filtrage_porte') | int(default=-80) %}
        {{ rssi >= seuil }}

    - name: "Badge 2 à portée Porte"
      unique_id: badge_2_a_portee_porte
      icon: mdi:motion-sensor
      state: >
        {% set rssi = state_attr('input_text.badge_2_mac', 'rssi_porte') | int(default=-999) %}
        {% set seuil = states('input_number.badge_rssi_filtrage_porte') | int(default=-80) %}
        {{ rssi >= seuil }}

    - name: "Badge 3 à portée Porte"
      unique_id: badge_3_a_portee_porte
      icon: mdi:motion-sensor
      state: >
        {% set rssi = state_attr('input_text.badge_3_mac', 'rssi_porte') | int(default=-999) %}
        {% set seuil = states('input_number.badge_rssi_filtrage_porte') | int(default=-80) %}
        {{ rssi >= seuil }}

    # Badge à portée - Maison
    - name: "Badge 1 à portée Maison"
      unique_id: badge_1_a_portee_maison
      icon: mdi:motion-sensor
      state: >
        {% set rssi = state_attr('input_text.badge_1_mac', 'rssi_maison') | int(default=-999) %}
        {% set seuil = states('input_number.badge_rssi_filtrage_maison') | int(default=-80) %}
        {{ rssi >= seuil }}

    - name: "Badge 2 à portée Maison"
      unique_id: badge_2_a_portee_maison
      icon: mdi:motion-sensor
      state: >
        {% set rssi = state_attr('input_text.badge_2_mac', 'rssi_maison') | int(default=-999) %}
        {% set seuil = states('input_number.badge_rssi_filtrage_maison') | int(default=-80) %}
        {{ rssi >= seuil }}

    - name: "Badge 3 à portée Maison"
      unique_id: badge_3_a_portee_maison
      icon: mdi:motion-sensor
      state: >
        {% set rssi = state_attr('input_text.badge_3_mac', 'rssi_maison') | int(default=-999) %}
        {% set seuil = states('input_number.badge_rssi_filtrage_maison') | int(default=-80) %}
        {{ rssi >= seuil }}

# ============================================================================
# SCRIPT - Gestion des événements de détection badges
# ============================================================================
script:
  # Mise à jour RSSI + armement de la durée badge
  jardin_traiter_detection_badge:
    description: "Traite une détection de badge (RSSI + durée)"
    mode: queued
    max_runs: 10
    variables:
      mac_normalise: "{{ (mac | default('') | upper | replace(' ', '')) }}"
      badge_index: |
        {%- set b1 = (states('input_text.badge_1_mac') | default('') | upper | replace(' ', '')) -%}
        {%- set b2 = (states('input_text.badge_2_mac') | default('') | upper | replace(' ', '')) -%}
        {%- set b3 = (states('input_text.badge_3_mac') | default('') | upper | replace(' ', '')) -%}
        {%- if mac_normalise == b1 -%}1
        {%- elif mac_normalise == b2 -%}2
        {%- elif mac_normalise == b3 -%}3
        {%- else -%}0{%- endif -%}
      rssi_int: "{{ rssi | int(default=-999) }}"
      seuil_porte: "{{ states('input_number.badge_rssi_filtrage_porte') | int(default=-80) }}"
      seuil_maison: "{{ states('input_number.badge_rssi_filtrage_maison') | int(default=-80) }}"
    sequence:
      # Mise à jour du RSSI (avant filtrage, pour calibration)
      - if: "{{ source in ['PORTE', 'MAISON'] and badge_index | int > 0 }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: "input_text.badge_{{ badge_index }}_mac"
            data:
              value: "{{ states('input_text.badge_' + badge_index + '_mac') }}"
              attributes:
                rssi_{{ source | lower }}: "{{ rssi_int }}"

      # Horodatage dernier badge
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.jardin_dernier_badge_vu
        data:
          datetime: "{{ now().isoformat() }}"

      # Filtre RSSI + armement durée
      - if: "{{ badge_index | int > 0 }}"
        then:
          - if: "{{ (source == 'PORTE' and rssi_int >= seuil_porte) or (source == 'MAISON' and rssi_int >= seuil_maison) }}"
            then:
              # Récupérer la durée du badge (input_datetime stockée comme "HH:MM:SS")
              - variables:
                  duree_badge_dt: "{{ states('input_datetime.badge_' + badge_index + '_duree') }}"
                  duree_badge_sec: |
                    {%- set dt = states('input_datetime.badge_' + badge_index + '_duree') -%}
                    {%- if dt and dt != 'unknown' and dt != 'unavailable' -%}
                      {%- set ts = (as_timestamp(dt) - as_timestamp('1970-01-01')) | int -%}
                      {{ ts }}
                    {%- else -%}
                      {{ states('input_number.duree_active_d_eclairage') | int(default=60) }}
                    {%- endif -%}

              # Ajouter au journal
              - service: script.jardin_ajouter_journal
                data:
                  nom: "{{ states('input_text.badge_' + badge_index + '_nom') }}"
                  rssi: "{{ rssi_int }}"
                  source: "{{ source }}"

              # Envoyer toggle_after au Shelly
              - service: rest_command.shelly_toggle_with_delay
                data:
                  duration: "{{ duree_badge_sec }}"

  # Ajouter une entrée au journal JSON
  jardin_ajouter_journal:
    description: "Ajoute un passage au journal JSON"
    mode: queued
    variables:
      journal_actuel: "{{ (states('input_text.jardin_journal_passages') | default('[]') | from_json) }}"
    sequence:
      - variables:
          nouvelle_entree:
            timestamp: "{{ now().isoformat() }}"
            nom: "{{ nom | default('Inconnu') }}"
            rssi: "{{ rssi | default(0) }}"
            source: "{{ source | default('?') }}"
          journal_mis_a_jour: |
            {%- set journal = journal_actuel -%}
            {%- set _ = journal.insert(0, nouvelle_entree) -%}
            {%- if journal | length > 10 -%}
              {{ journal[:10] | tojson }}
            {%- else -%}
              {{ journal | tojson }}
            {%- endif -%}

      - service: input_text.set_value
        target:
          entity_id: input_text.jardin_journal_passages
        data:
          value: "{{ journal_mis_a_jour[:5000] }}"

  # Extinction manuelle : restaurer durée de base
  jardin_extinction_manuelle:
    description: "Extinction manuelle - restaure durée de base"
    sequence:
      - service: rest_command.shelly_set_duration
        data:
          duration: "{{ states('input_number.duree_active_d_eclairage') | int(default=60) }}"

# ============================================================================
# AUTOMATISATIONS - Logique de détection et pilotage
# ============================================================================
automation:
  # Détection d'un badge BLE via événement ESPHome
  - alias: "Jardin - Détection badge BLE"
    description: "Traite les événements de détection badge"
    trigger:
      platform: event
      event_type: esphome.presence_ble
    action:
      - service: script.jardin_traiter_detection_badge
        data:
          mac: "{{ trigger.event.data.mac }}"
          rssi: "{{ trigger.event.data.rssi }}"
          source: "{{ trigger.event.data.source }}"

  # Extinction manuelle (via tableau de bord)
  - alias: "Jardin - Extinction manuelle"
    description: "Restaure durée de base à l'extinction"
    trigger:
      platform: state
      entity_id: switch.shelly1g4_ccba97c455a0
      to: "off"
    action:
      - delay: 500ms  # Attendre réaction Shelly
      - service: script.jardin_extinction_manuelle

  # Synchro durée de base au démarrage de HA
  - alias: "Jardin - Synchro durée au démarrage"
    description: "Pousse la durée de base vers le Shelly au démarrage"
    trigger:
      platform: homeassistant
      event: start
    action:
      - delay: 10s  # Attendre HA prêt
      - service: rest_command.shelly_set_duration
        data:
          duration: "{{ states('input_number.duree_active_d_eclairage') | int(default=60) }}"

  # Synchro durée de base si changement dans le tableau de bord
  - alias: "Jardin - Synchro durée sur changement"
    description: "Pousse la durée de base vers le Shelly si modification"
    trigger:
      platform: state
      entity_id: input_number.duree_active_d_eclairage
    action:
      - service: rest_command.shelly_set_duration
        data:
          duration: "{{ states('input_number.duree_active_d_eclairage') | int(default=60) }}"
